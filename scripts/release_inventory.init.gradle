import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact
import javax.xml.parsers.DocumentBuilderFactory
import java.security.MessageDigest
import java.util.zip.ZipFile

// Inspect the resolved Android release graph, not the empty root project.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('releaseDependencyEvidence') {
        doLast {
            def out = new File(gradle.rootProject.projectDir, 'build/compliance')
            out.mkdirs()
            def configurations = ['releaseRuntimeClasspath', 'coreLibraryDesugaring']
            def modules = [:]
            def artifacts = []
            configurations.each { configurationName ->
                def configuration = app.configurations.getByName(configurationName)
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) modules[component.id.displayName] = component.id
                }
                configuration.incoming.artifacts.artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    if (!(id instanceof ModuleComponentIdentifier)) throw new GradleException('Unidentified release artifact')
                    def hash = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                    def notices = []
                    if (artifact.file.name.endsWith('.jar') || artifact.file.name.endsWith('.aar')) {
                        new ZipFile(artifact.file).withCloseable { archive ->
                            archive.entries().each { entry ->
                                if (!entry.directory && entry.name.toUpperCase(Locale.ROOT).matches('.*(LICENSE|NOTICE|COPYING).*')) {
                                    if (entry.size > 1_000_000) throw new GradleException('Oversized license entry')
                                    def text = archive.getInputStream(entry).withCloseable { it.getText('UTF-8') }
                                    notices << [path: entry.name, text: text]
                                }
                            }
                        }
                    }
                    artifacts << [coordinate: id.displayName, configuration: configurationName,
                        file: artifact.file.name, sha256: hash, embeddedNotices: notices]
                }
            }
            def query = app.dependencies.createArtifactResolutionQuery().forComponents(modules.values())
                .withArtifacts(MavenModule, MavenPomArtifact).execute()
            def poms = [:]
            def parser = DocumentBuilderFactory.newInstance()
            parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
            parser.setFeature('http://xml.org/sax/features/external-general-entities', false)
            parser.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
            parser.setXIncludeAware(false)
            parser.setExpandEntityReferences(false)
            query.resolvedComponents.each { component ->
                component.getArtifacts(MavenPomArtifact).each { artifact ->
                    if (artifact instanceof ResolvedArtifactResult) {
                        def document = parser.newDocumentBuilder().parse(artifact.file)
                        def licenses = []
                        def nodes = document.getElementsByTagName('license')
                        for (int i = 0; i < nodes.length; i++) {
                            def element = nodes.item(i)
                            licenses << [name: element.getElementsByTagName('name').item(0)?.textContent?.trim(),
                                url: element.getElementsByTagName('url').item(0)?.textContent?.trim()]
                        }
                        poms[component.id.displayName] = licenses
                    }
                }
            }
            def components = modules.keySet().sort().collect { coordinate ->
                [coordinate: coordinate, licenses: poms[coordinate] ?: [],
                    artifacts: artifacts.findAll { it.coordinate == coordinate }.sort { it.file }]
            }
            def report = [schema: 1, project: ':app', configurations: configurations,
                commit: System.getenv('GITHUB_SHA') ?: 'local', components: components,
                scope: 'Resolved inputs; not a signed-binary or legal approval audit']
            new File(out, 'release-inventory.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            println "Recorded ${components.size()} resolved modules and ${artifacts.size()} artifact hashes."
        }
    }
}
