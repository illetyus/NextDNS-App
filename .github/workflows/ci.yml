name: Android CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate committed Gradle Wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Require Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
        shell: bash

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Compile Debug
        run: ./gradlew :app:compileDebugKotlin --no-daemon
        shell: bash

      - name: Android Lint
        run: ./gradlew :app:lintDebug --no-daemon
        shell: bash

      - name: Unit, Contract & Compose UI Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        shell: bash

      - name: Generate Coverage Report
        run: ./gradlew :app:jacocoTestReport --no-daemon
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: illetyus/NextDNS-App
          fail_ci_if_error: true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # pinned master

      - name: Snyk High-Severity Gate
        run: snyk test --severity-threshold=high
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Validate Release Build
        run: ./gradlew :app:assembleRelease --no-daemon
        shell: bash
