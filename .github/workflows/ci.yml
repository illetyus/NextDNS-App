name: Android CI & Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'
          verify-signature: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Verify Gradle Wrapper Files
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
        shell: bash

      - name: Compile, Lint, Test & Coverage
        run: >
          ./gradlew
          :app:assembleDebug
          :app:lintDebug
          :app:testDebugUnitTest
          :app:jacocoTestReport
          --no-daemon
          --stacktrace
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: illetyus/NextDNS-App
          fail_ci_if_error: true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk High-Severity Dependency Gate
        run: snyk test --severity-threshold=high --all-projects
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
