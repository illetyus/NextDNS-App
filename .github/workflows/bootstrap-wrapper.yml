name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [ "phase7-tests-ci" ]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: phase7-tests-ci

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle 9.3.1 wrapper if missing
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Committed wrapper already exists; nothing to bootstrap."
            exit 0
          fi

          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet || git commit -m "build: commit Gradle 9.3.1 wrapper"
          git push origin HEAD:phase7-tests-ci
        shell: bash
